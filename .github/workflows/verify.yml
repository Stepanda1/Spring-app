name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests with PostgreSQL and RabbitMQ
        run: docker compose --profile test run --rm tests
      - name: Build and launch application
        run: docker compose up -d --build app
      - name: HTTP workflow, broker outage and restart recovery
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: rabbitmq-amqp-tutorials/target/surefire-reports/
      - name: Cleanup
        if: always()
        run: docker compose down -v
